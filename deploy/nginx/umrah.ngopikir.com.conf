# ============================================
# VirtualHost: umrah.ngopikir.com
# Konfigurasi final (HTTP redirect + HTTPS).
# JANGAN di-mount sebelum sertifikat tersedia.
# Diaktifkan oleh: /home/wp/manasik-ihya/deploy/scripts/issue-cert.sh
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name umrah.ngopikir.com;

    location /.well-known/acme-challenge/ {
        root /var/www/manasik-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name umrah.ngopikir.com;

    ssl_certificate /etc/letsencrypt/live/umrah.ngopikir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umrah.ngopikir.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/umrah.ngopikir.com/chain.pem;

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    client_max_body_size 10m;
    proxy_read_timeout 60s;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $manasik_upstream http://manasik-ihya:80;

    location / {
        proxy_pass $manasik_upstream;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
