services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: https://umrah.ngopikir.com
    container_name: manasik-ihya
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - manasik-ihya-network

networks:
  manasik-ihya-network:
    name: manasik-ihya_manasik-ihya-network
    driver: bridge
